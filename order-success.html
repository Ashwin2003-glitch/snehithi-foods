<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed - SNEHITHI Home grown foods</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body style="background:linear-gradient(135deg,#f0fff4,#e8f5e9);">

<div class="success-page">
  <div class="success-card">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    <h1 class="success-title" id="successTitle">Order Confirmed!</h1>
    <p class="success-text" id="successText"></p>

    <div style="background:var(--light);border-radius:var(--radius);padding:20px;margin-bottom:28px;text-align:left;">
      <div style="font-size:0.85rem;color:var(--gray);margin-bottom:8px;">
        <i class="fab fa-whatsapp" style="color:#25D366;"></i>
        WhatsApp order receipt sent with:
      </div>
      <div style="font-weight:700;font-size:0.92rem;color:var(--primary);margin-bottom:4px;">
        💳 Payment: Paid through UPI
      </div>
      <div id="utrBadge" style="font-size:0.85rem;color:var(--dark);margin-bottom:8px;"></div>
      <div style="font-weight:600;font-size:0.9rem;color:var(--dark);">✅ Notification sent to Store Owner</div>
      <div style="font-weight:600;font-size:0.9rem;color:var(--dark);">✅ Receipt opened for Customer</div>
    </div>

    <div class="success-actions">
      <a href="products.html" class="btn btn-primary">
        <i class="fas fa-leaf"></i> Continue Shopping
      </a>
      <a href="https://wa.me/919171133442" class="btn btn-whatsapp">
        <i class="fab fa-whatsapp"></i> Chat with Us
      </a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name   = params.get("name") || "Customer";
  const utr    = params.get("utr") || "";
  const total  = params.get("total") || "";

  document.getElementById("successTitle").textContent = "Thank you, " + name + "! 🎉";

  if (utr && utr !== "Free Order") {
    document.getElementById("utrBadge").innerHTML = "🔖 <strong>UPI UTR / Ref:</strong> " + utr;
  }

  document.getElementById("successText").innerHTML =
    `Your order has been recorded successfully!<br>
     We have sent the order details mentioning <strong>"Paid through UPI"</strong> to WhatsApp.`;
</script>
</body>
</html>
